# slipreel.app — static marketing site + flow pages (rsync'd to /var/www/slipreel).
# Clean URLs: /pricing -> pricing.html, /login -> login.html, etc.
# TLS via certbot (certbot --nginx -d slipreel.app -d www.slipreel.app).
#
# NOTE: this webroot is shared with the release pipeline (appcast.xml + DMGs).
# See scripts/deploy-site.sh — never use rsync removal flags against it.
server {
    listen 80;
    listen [::]:80;
    server_name slipreel.app www.slipreel.app;
    root /var/www/slipreel;
    index index.html;

    # Baseline browser protections. CSP starts in report-only mode so the
    # production request inventory can be verified before enforcement.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; connect-src 'self' https://api.slipreel.app; font-src 'self'; form-action 'self' https://checkout.stripe.com; frame-ancestors 'none'; img-src 'self' data:; media-src 'self' blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; upgrade-insecure-requests" always;

    # Try the exact path, then <path>.html, then a directory index, else 404.
    # This serves the clean URLs the API's success/cancel/portal return URLs use
    # (/success, /pricing, /account) from success.html/pricing.html/account.html.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Static assets. The appcast + DMG downloads live here too (written by the
    # release pipeline); do not add restrictive rules that would hide them.
    # Some default MIME maps omit WebM. Keep the explicit type so browsers do
    # not reject the preferred video source when nosniff is enabled.
    location ~* ^/assets/video/.*\.webm$ {
        try_files $uri =404;
        types { video/webm webm; }
        expires 1h;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1h;
    }

    # PostHog analytics reverse proxy (US region). Keeps analytics first-party:
    # the tuned snippet in assets/js/analytics.js posts to /ingest on this
    # origin instead of *.posthog.com, so there is one fewer TLS handshake, no
    # third-party request (site-lint rule #1), and tracker blockers don't drop
    # it. /ingest/static/* -> PostHog's asset CDN; /ingest/* -> ingestion API.
    #
    # proxy_ssl_server_name must be on so SNI reaches PostHog's TLS. The empty
    # Accept-Encoding on the asset path avoids upstream gzip that nginx would
    # then have to buffer. Note: this block belongs in the server{} that serves
    # live traffic — after certbot runs that is the listen 443 block it creates,
    # so mirror these two locations there (this file is the pre-TLS reference).
    location ^~ /ingest/static/ {
        proxy_pass https://us-assets.i.posthog.com/static/;
        proxy_set_header Host us-assets.i.posthog.com;
        proxy_ssl_server_name on;
        proxy_set_header Accept-Encoding "";
        proxy_hide_header Set-Cookie;
        expires 1h;
    }
    location ^~ /ingest/ {
        proxy_pass https://us.i.posthog.com/;
        proxy_set_header Host us.i.posthog.com;
        proxy_ssl_server_name on;
    }
}
