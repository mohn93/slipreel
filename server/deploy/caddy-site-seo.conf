# Import inside the slipreel.app site block, before the handle blocks.
# Keep this outside the static handle: try_files rewrites must happen AFTER redirects.
# Only public content aliases redirect; auth and checkout callbacks retain their paths.

# Browser protections apply to every Slipreel response. CSP starts in report-only
# mode so violations can be checked in production before enforcement.
header {
    Strict-Transport-Security "max-age=31536000; includeSubDomains"
    X-Content-Type-Options "nosniff"
    X-Frame-Options "DENY"
    Referrer-Policy "strict-origin-when-cross-origin"
    Permissions-Policy "camera=(), geolocation=(), microphone=()"
    Content-Security-Policy-Report-Only "default-src 'self'; base-uri 'self'; connect-src 'self' https://api.slipreel.app; font-src 'self'; form-action 'self' https://checkout.stripe.com; frame-ancestors 'none'; img-src 'self' data:; media-src 'self' blob:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; upgrade-insecure-requests"
}

# Caddy's default MIME database can classify WebM by its audio alias. Slipreel's
# assets are videos, and the explicit type is required once nosniff is enabled.
@slipreelWebm path /assets/video/*.webm
header @slipreelWebm Content-Type video/webm

@seoHomeQuery {
    path /index /index.html
    expression `{http.request.uri.query} != ""`
}
redir @seoHomeQuery /?{query} 308
@seoHome {
    path /index /index.html
    expression `{http.request.uri.query} == ""`
}
redir @seoHome / 308
@seoPageQuery {
    path_regexp seoPageQuery ^/(about|guide|downloads|changelog|privacy|screen-studio-alternative|loom-alternative|screenflow-alternative|quicktime-alternative)(\.html|/)$
    expression `{http.request.uri.query} != ""`
}
redir @seoPageQuery /{re.seoPageQuery.1}?{query} 308
@seoPage {
    path_regexp seoPage ^/(about|guide|downloads|changelog|privacy|screen-studio-alternative|loom-alternative|screenflow-alternative|quicktime-alternative)(\.html|/)$
    expression `{http.request.uri.query} == ""`
}
redir @seoPage /{re.seoPage.1} 308
