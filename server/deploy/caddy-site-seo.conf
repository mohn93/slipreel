# Import inside the slipreel.app site block, before the handle blocks.
# Keep this outside the static handle: try_files rewrites must happen AFTER redirects.
# Only public content aliases redirect; auth and checkout callbacks retain their paths.
@seoHomeQuery {
    path /index /index.html
    expression `{http.request.uri.query} != ""`
}
redir @seoHomeQuery /?{query} 308
@seoHome {
    path /index /index.html
    expression `{http.request.uri.query} == ""`
}
redir @seoHome / 308
@seoPageQuery {
    path_regexp seoPageQuery ^/(guide|downloads|changelog|privacy|screen-studio-alternative|loom-alternative|screenflow-alternative|quicktime-alternative)(\.html|/)$
    expression `{http.request.uri.query} != ""`
}
redir @seoPageQuery /{re.seoPageQuery.1}?{query} 308
@seoPage {
    path_regexp seoPage ^/(guide|downloads|changelog|privacy|screen-studio-alternative|loom-alternative|screenflow-alternative|quicktime-alternative)(\.html|/)$
    expression `{http.request.uri.query} == ""`
}
redir @seoPage /{re.seoPage.1} 308
