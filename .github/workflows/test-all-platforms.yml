name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze-and-test:
    name: Analyze + Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: brew install ffmpeg
      - run: dart pub global activate melos ^6.0.0
      - run: melos bootstrap
      - run: melos run analyze --no-select
      - run: melos run test --no-select

  test-linux:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libx11-dev ffmpeg
      - run: dart pub global activate melos ^6.0.0
      - run: melos bootstrap
      # Linux only runs the platform-agnostic packages (engine + platform
      # interface). The app shell is macOS-specific and the native plugin
      # packages can't be unit-tested without a real native runner — the full
      # suite runs on the macOS job. See the `test_portable` script in melos.yaml.
      - run: melos run test_portable --no-select
